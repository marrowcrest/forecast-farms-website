name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'images/**'
      - 'archive/**'
      - 'build.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow (phone-sized photo copies)
        run: pip install pillow
      - name: Build docs/ and ghl/
        run: python build.py
      - name: Commit rebuilt pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs ghl images
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Rebuild docs/ and ghl/"
            git push
          fi
